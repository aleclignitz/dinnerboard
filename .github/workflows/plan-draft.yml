name: Wednesday plan draft

on:
  schedule:
    # 12:00 UTC ~= 7:00 AM America/Chicago (CDT). Adjust for your time zone/DST.
    # Runs an hour after the weekly-ad fetch so it can read ads/current.
    - cron: "0 12 * * 3"
  workflow_dispatch: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: node scripts/plan-draft.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAN_TIME_ZONE: America/Chicago
          PLAN_GUIDELINES: ${{ vars.PLAN_GUIDELINES }}
