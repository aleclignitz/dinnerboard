name: Wednesday grocery list

on:
  schedule:
    # 13:00 UTC ~= 8:00 AM America/Chicago (CDT). Adjust for your time zone/DST.
    # Runs an hour after plan-draft, leaving the rest of Wednesday to review
    # and place the order before the midnight cutoff.
    - cron: "0 13 * * 3"
  workflow_dispatch: {}

jobs:
  grocery-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: node scripts/grocery-list.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STORE_NAME: ${{ vars.STORE_NAME }}
          ORDER_METHOD: ${{ vars.ORDER_METHOD }}
          PICKUP_WINDOW: ${{ vars.PICKUP_WINDOW }}
          SUBSTITUTION_RULES: ${{ vars.SUBSTITUTION_RULES }}
