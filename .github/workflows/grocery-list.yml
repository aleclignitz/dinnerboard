name: Thursday grocery list

on:
  schedule:
    # 23:50 UTC ~= 5:50 PM America/Chicago (CST). Adjust for your time zone/DST.
    - cron: "50 23 * * 4"
  workflow_dispatch: {}

jobs:
  grocery-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: node scripts/grocery-list.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STORE_NAME: ${{ vars.STORE_NAME }}
          ORDER_METHOD: ${{ vars.ORDER_METHOD }}
          SUBSTITUTION_RULES: ${{ vars.SUBSTITUTION_RULES }}
