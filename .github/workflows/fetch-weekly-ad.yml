name: Wednesday weekly ad fetch

on:
  schedule:
    # 11:00 UTC ~= 6:00 AM America/Chicago (CDT). Adjust for your time zone/DST.
    - cron: "0 11 * * 3"
  workflow_dispatch: {}

jobs:
  fetch-ad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/fetch-weekly-ad.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOM_THUMB_ZIP: ${{ vars.TOM_THUMB_ZIP }}
          TOM_THUMB_STORE_ADDRESS: ${{ vars.TOM_THUMB_STORE_ADDRESS }}
