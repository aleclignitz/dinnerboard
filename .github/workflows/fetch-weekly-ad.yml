name: Weekly ad fetch

on:
  schedule:
    # 11:00 UTC ~= 6:00 AM America/Chicago (CDT), Wednesday, when the ad publishes.
    - cron: "0 11 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: fetch from Flipp and print a summary; write nothing and skip the fallback"
        type: boolean
        default: false

jobs:
  fetch-ad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOM_THUMB_ZIP: ${{ vars.TOM_THUMB_ZIP }}
      TOM_THUMB_STORE_ADDRESS: ${{ vars.TOM_THUMB_STORE_ADDRESS }}
      TOM_THUMB_STORAGE_STATE: ${{ secrets.TOM_THUMB_STORAGE_STATE }}
      FLIPP_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Primary: Flipp JSON (no browser, no session state). A real run may fall
      # back to the scraper; a dry run must fail visibly instead.
      - name: Fetch from Flipp
        id: flipp
        continue-on-error: ${{ !inputs.dry_run }}
        run: node scripts/fetch-flipp-ad.mjs
      - name: Flipp failed, falling back to Playwright
        if: steps.flipp.outcome == 'failure' && !inputs.dry_run
        run: echo "::warning::Flipp fetch failed; using the Playwright scraper as fallback."
      # Fallback: only runs (and only installs the browser) if Flipp failed.
      - name: Install Playwright browser
        if: steps.flipp.outcome == 'failure' && !inputs.dry_run
        run: npx playwright install --with-deps chromium
      - name: Fetch with Playwright (fallback)
        if: steps.flipp.outcome == 'failure' && !inputs.dry_run
        run: node scripts/fetch-weekly-ad.mjs
