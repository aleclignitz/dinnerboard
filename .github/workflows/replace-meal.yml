name: Replace meal

on:
  # Started by the board's "Replace this meal" button.
  workflow_dispatch: {}

concurrency:
  group: replace-meal
  cancel-in-progress: false

jobs:
  replace-meal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PLAN_GUIDELINES: ${{ vars.PLAN_GUIDELINES }}
      PLAN_MAX_COOK_MINUTES: ${{ vars.PLAN_MAX_COOK_MINUTES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/replace-meal.mjs
